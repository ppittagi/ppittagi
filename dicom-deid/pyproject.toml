[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-deid"
version = "1.0.0"
description = "DICOM de-identification with template-based burned-in text redaction"
requires-python = ">=3.11"
dependencies = [
  "pydicom>=3.0,<4",
  "numpy>=1.26",
  "pillow>=10",
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.1",
  "pylibjpeg-openjpeg>=2.3",
  "pylibjpeg-rle>=2.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
deid = "deid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
